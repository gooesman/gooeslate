name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/gooeslate.exe ./cmd/gooestranslate
      - run: go build -o dist/gooeslate-check.exe ./cmd/gooestranslate
      - run: ./dist/gooeslate-check.exe --smoke-test test-artifacts
      - name: Verify visible WebView rendering
        run: ./dist/gooeslate-check.exe --render-smoke-test test-artifacts
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rendering-diagnostics
          path: test-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: gooeslate-windows-x64
          path: dist/gooeslate.exe
